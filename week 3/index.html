<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 6 - Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <main class="profile-container">
 <!-- Task 6.1: Box model demonstration -->
        <section class="box-model-demo">
            <h2>Task 6.1: CSS Box Model</h2>
            <div class="box-model-example">
                <span>Content</span>
                <small>Padding + Border + Margin</small>
            </div>
            <p>box-sizing: border-box;</p>
        </section>
      <!-- Task 6.2: First profile card -->
        <article class="profile-card card-blue">
            <div class="profile-header">
                <img
                    src="profile.jpg"
                    alt="Profile photo"
                    class="avatar"
                >
                <h2>Abhay Singh Rathore</h2>
                <p class="role">Web Development Student</p>
            </div>
            <!-- Task 6.2: Second colour version -->
        <article class="profile-card card-purple">
            <div class="profile-header">
                <img
                    src="profile.jpg"
                    alt="Profile photo"
                    class="avatar"
                >
                <h2>Abhay Singh Rathore</h2>
                <p class="role">Creative Web Designer</p>
            </div>
 </main>
</body>
</html>
